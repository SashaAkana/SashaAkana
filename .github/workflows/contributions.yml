name: Feed the contribution snake

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#ffad56&color_dots=#21262d,#63351d,#a65320,#e18432,#ffb96b
            assets/snake-light.svg?palette=github-light&color_snake=#a84b14&color_dots=#ebedf0,#ffdfbc,#ffb46d,#e47c2c,#a84b14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/snake-dark.svg
          test -s assets/snake-light.svg
          git add -- assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo 'No contribution changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: feed the contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
